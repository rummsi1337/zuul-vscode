repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.50.0
    hooks:
      - id: markdownlint
        exclude: ^(\.plan/|IMPLEMENTATION_PLAN\.md$)
  - repo: local
    hooks:
      - id: check
        name: check
        entry: npm run check
        language: system
        pass_filenames: false
      - id: lockfile-sync
        name: lockfile-sync
        entry: npm ci --dry-run --ignore-scripts
        language: system
        pass_filenames: false
        files: ^package(-lock)?\.json$
